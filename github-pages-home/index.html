<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Andrea Galliani — il sito si è trasferito</title>
<meta name="description" content="Questo sito si è trasferito su andreagalliani.com" />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://andreagalliani.com/" />
<link rel="icon" href="/icons8-circuito-100.png" />

<!-- Redirect automatico "best effort": funziona anche senza JavaScript.
     L'attesa dà il tempo alla pagina di comparire prima di spostarsi. -->
<meta http-equiv="refresh" content="5; url=https://andreagalliani.com/" />

<style>
  :root {
    --bg: #020617;        /* slate-950 */
    --fg: #e2e8f0;        /* slate-200 */
    --muted: #94a3b8;     /* slate-400 */
    --accent: #fbbf24;    /* amber-400 */
    --accent-dim: #92700a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Sfondo animato: due aloni sfocati che si muovono lentamente. Puro CSS,
     nessuna dipendenza esterna, nessun impatto su /timeline-me/. */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
    will-change: transform;
  }

  .glow--amber {
    width: 42vmax;
    height: 42vmax;
    background: var(--accent);
    top: -10vmax;
    left: -10vmax;
    animation: drift1 18s ease-in-out infinite alternate;
  }

  .glow--slate {
    width: 38vmax;
    height: 38vmax;
    background: #38bdf8;
    bottom: -12vmax;
    right: -8vmax;
    opacity: 0.18;
    animation: drift2 22s ease-in-out infinite alternate;
  }

  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(8vmax, 6vmax) scale(1.15); }
  }

  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-6vmax, -8vmax) scale(1.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow--amber, .glow--slate { animation: none; }
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 34rem;
    margin: 1.5rem;
    padding: 2.5rem 2rem;
    text-align: center;
  }

  .eyebrow {
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 0.75rem;
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.25;
    margin: 0 0 0.75rem;
  }

  p.sub {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 2rem;
  }

  p.sub .en {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.9rem;
    opacity: 0.85;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.9rem 1.8rem;
    background: var(--accent);
    color: #1c1305;
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55);
    animation: pulse 2.4s ease-in-out infinite;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:hover, .btn:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(251, 191, 36, 0.35);
  }

  .btn svg { width: 1.1em; height: 1.1em; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.45); }
    70%  { box-shadow: 0 0 0 14px rgba(251, 191, 36, 0); }
    100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { animation: none; }
  }

  .countdown {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .countdown strong {
    color: var(--fg);
  }
</style>
</head>
<body>
  <div class="glow glow--amber" aria-hidden="true"></div>
  <div class="glow glow--slate" aria-hidden="true"></div>

  <main class="card">
    <p class="eyebrow">Nuovo indirizzo</p>
    <h1>Questo sito si è trasferito</h1>
    <p class="sub">
      Il portfolio di Andrea Galliani ora vive su andreagalliani.com.
      <span class="en">This site has moved — the portfolio now lives at andreagalliani.com.</span>
    </p>

    <a class="btn" href="https://andreagalliani.com/">
      Vai al nuovo sito
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <p class="countdown">
      Ti porto lì automaticamente tra <strong id="secs">5</strong> secondi…
    </p>
  </main>

  <script>
    // Miglioramento progressivo del meta-refresh: mostra un conto alla
    // rovescia reale quando JS è disponibile. Se JS è disabilitato, il
    // meta-refresh nell'head fa comunque il suo lavoro.
    (function () {
      var el = document.getElementById('secs');
      var n = 5;
      var dest = 'https://andreagalliani.com/';
      var id = setInterval(function () {
        n -= 1;
        if (el) el.textContent = String(Math.max(n, 0));
        if (n <= 0) {
          clearInterval(id);
          window.location.replace(dest);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
